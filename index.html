<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>マイアプリ</title>
<style>
:root { --bg: #f6f7f9; --card: #fff; --text: #1f2430; --sub: #667085; --line: #e3e6ec; }
@media (prefers-color-scheme: dark) { :root { --bg: #12151b; --card: #1c2029; --text: #e8ebf2; --sub: #9aa3b5; --line: #2c3240; } }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Hiragino Sans", sans-serif; line-height: 1.6; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; }
a.app { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; color: inherit; text-decoration: none; }
a.app b { display: block; }
a.app span { color: var(--sub); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>マイアプリ</h1>
  <a class="app" href="30min-rule/"><b>30分ルール</b><span>30分調べて分からなければ人に聞く</span></a>
</main>
</body>
</html>
